 <radialGradient id="glow"><stop stop-color="#fff3bb" stop-opacity=".95"/><stop offset="1" stop-color="#fff3bb" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
